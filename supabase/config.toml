project_id = "longview-investment-intelligence"

[auth]
site_url = "http://127.0.0.1:4175"
additional_redirect_urls = ["http://127.0.0.1:4175/**", "http://localhost:4175/**"]
enable_anonymous_sign_ins = true
enable_manual_linking = true

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_confirmations = true
max_frequency = "1m"
otp_length = 8

[functions.ingest-sec]
verify_jwt = true

[functions.ingest-news]
verify_jwt = true

[functions.ingest-prices]
verify_jwt = true
